# /etc/nginx/sites-available/snapsolutions.io
# Landing estática de Snap Solutions servida desde la carpeta build (dist/).
# Después de crear este archivo:
#   sudo ln -s /etc/nginx/sites-available/snapsolutions.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d snapsolutions.io -d www.snapsolutions.io   # agrega HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name snapsolutions.io www.snapsolutions.io;

    # Carpeta donde subís el contenido de dist/
    root /var/www/snapsolutions/current;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Cache largo para los assets con hash (Vite les pone un hash único)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El HTML no se cachea, así siempre ven la última versión
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
